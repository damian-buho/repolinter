name: Pipeline
# Validation pipeline. Runs on PRs and pushes to main.
# Release.yaml fires via workflow_run on the branch-push Pipeline run;
# the tag must be pushed before the pipeline finishes (normal cog flow).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs collapse to one in-flight run per branch; main pushes never cancel each
  # other so we keep a full history of green/red on the default branch.
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  test:
    name: Test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # rule tests grep historical commits; a shallow clone breaks them

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild

      - run: pnpm build

      - run: pnpm test

  docker:
    name: Docker smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/${{ github.repository }}:ci
          # Branch-scoped cache: PR builds and main builds never share the same
          # scope, so a malicious PR cannot poison the cache read by main.
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to:   type=gha,scope=${{ github.ref_name }},mode=max
