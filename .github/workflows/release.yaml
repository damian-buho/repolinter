name: Release
# Tag-triggered: re-runs the full validation pipeline against the tagged SHA,
# then publishes to npm (OIDC trusted publishing) and GHCR (multiarch).

on:
  push:
    tags: ['**']

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight release — a half-published tag is worse than a delay.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Pipeline
    uses: ./.github/workflows/pipeline.yaml
    permissions:
      contents: read

  publish:
    name: Publish
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub release creation
      id-token: write  # OIDC for npm provenance + GHCR attestation
      packages: write  # push image to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'  # npm 11.5+ ships here; trusted publishing requires it
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # prepublishOnly runs the build, so no explicit build step is needed.
      - name: Publish to npm
        run: npm publish --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - uses: docker/setup-qemu-action@v3  # arm64 emulation for multiarch build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # semver tag input drives {{version}}, {{major}}.{{minor}}, {{major}};
          # `latest` is auto-applied on semver tags by metadata-action's default flavor.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
