name: Release
# Fires when Pipeline finishes successfully and a git tag points to the head
# commit. Publishes to npm (OIDC trusted publishing) and GHCR (multiarch
# native: amd64 + arm64).
#
# To release: push a tag.
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Pipeline runs on the tag push; its success triggers this workflow; the gate
# finds the tag at HEAD; the rest publishes.
#
# There is no workflow_dispatch path — tag creation IS the release operation.
# Floating major/minor tag pushes use GITHUB_TOKEN so the tag push does not
# retrigger Pipeline, and therefore does not loop back into Release.
#
# Note: workflow_run-triggered workflows always run the version of this file
# from the default branch. To roll out a change to Release, merge to main first.

on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]

permissions:
  contents: read

concurrency:
  # workflow_run carries no meaningful github.ref — key on the underlying
  # head_sha so two pipeline runs for the same SHA (branch push + tag push)
  # serialize. Never cancel; the gate dedups any duplicate trigger.
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    # Two-fact gate: Pipeline must have succeeded for a push event, and the
    # head SHA must carry a tag we haven't already released. Either fails →
    # all downstream jobs no-op via `if: needs.gate.outputs.tag != ''`.
    name: Gate
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref:          ${{ github.event.workflow_run.head_sha }}
          fetch-depth:  0  # need full history + tags for the points-at check

      - id:   gate
        name: Resolve tag at HEAD (and dedup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tagged commits typically produce TWO Pipeline runs (branch push +
        # tag push), each firing Release. We dedup by skipping if a GitHub
        # release for this tag already exists from the first run.
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | head -n1)
          if [ -z "${tag}" ]; then
            echo "No tag at $(git rev-parse HEAD) — Pipeline succeeded but nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists — duplicate trigger ignored."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing ${tag} at $(git rev-parse HEAD)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish-npm:
    # npm publish + GitHub release + floating tags. Runs in parallel with the
    # per-arch image builds.
    name: Publish npm + GitHub release
    needs: gate
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents:  write  # GitHub release creation + floating tag push
      id-token:  write  # OIDC for npm provenance
    steps:
      - uses: actions/checkout@v6
        with:
          ref:          ${{ github.event.workflow_run.head_sha }}
          fetch-depth:  0  # full history so floating-tag moves can resolve refs

      - uses: actions/setup-node@v6
        with:
          node-version:  '24'  # npm 11.5+ ships here; trusted publishing requires it
          registry-url:  https://registry.npmjs.org
          cache:         npm

      - run: npm ci

      # prepublishOnly runs the build, so no explicit build step is needed.
      - name: Publish to npm
        run:  npm publish --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:               ${{ needs.gate.outputs.tag }}
          generate_release_notes: true

      # Floating tags let Marketplace consumers pin `@v1` / `@v1.2` and keep
      # receiving patch updates. Pushed with GITHUB_TOKEN so the tag push does
      # not retrigger Pipeline → no Release loop.
      - name: Update floating major/minor tags
        env:
          VERSION: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Skipping floating tags — '${VERSION}' is not a clean semver (pre-release or build metadata)"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          minor="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for floating in "${major}" "${minor}"; do
            echo "Moving ${floating} → $(git rev-parse HEAD)"
            git tag --force --annotate "${floating}" --message "Floating tag for ${VERSION}"
            git push --force origin "refs/tags/${floating}"
          done

  build-image:
    # Per-arch image build on a native runner. Each entry pushes by digest
    # only (no tag) so two arches never race to overwrite the same tag —
    # the manifest-merge job is the single writer of the released tags.
    name: Build image (${{ matrix.arch }})
    needs: gate
    if:    needs.gate.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents:  read
      id-token:  write  # OIDC for GHCR build attestation
      packages:  write  # push image by digest to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:     amd64
            platform: linux/amd64
            runner:   ubuntu-24.04
          - arch:     arm64
            platform: linux/arm64
            runner:   ubuntu-24.04-arm  # native GitHub-hosted arm64, no QEMU
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id:   meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push by digest
        id:   build
        uses: docker/build-push-action@v7
        with:
          context:    .
          platforms:  ${{ matrix.platform }}
          labels:     ${{ steps.meta.outputs.labels }}
          # push-by-digest: pushes a per-arch image to GHCR with no tag and
          # returns its digest. The manifest job glues these into one tag.
          outputs:    type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scopes so amd64 and arm64 don't evict each other.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to:   type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name:               digests-${{ matrix.arch }}
          path:               ${{ runner.temp }}/digests/*
          if-no-files-found:  error
          retention-days:     1

  publish-manifest:
    # Glue step: download per-arch digests, create a single multiarch manifest
    # list under the released tags, and push. Sole writer of the release tags.
    name: Publish manifest
    needs: [gate, build-image]
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      id-token:  write  # OIDC for GHCR attestation on the manifest list
      packages:  write  # push the multiarch manifest list
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path:            ${{ runner.temp }}/digests
          pattern:         digests-*
          merge-multiple:  true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id:   meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is auto-applied on semver values.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.gate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.gate.outputs.tag }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
