name: Release
# Fires when Pipeline finishes successfully and a git tag points to the head
# commit. Publishes to npm (OIDC trusted publishing) and GHCR (multiarch
# native: amd64 + arm64).
#
# To release: push a tag.
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Pipeline runs on the tag push; its success triggers this workflow; the gate
# finds the tag at HEAD; the rest publishes.
#
# There is no workflow_dispatch path — tag creation IS the release operation.
# Floating major/minor tag pushes use GITHUB_TOKEN so the tag push does not
# retrigger Pipeline, and therefore does not loop back into Release.
#
# Note: workflow_run-triggered workflows always run the version of this file
# from the default branch. To roll out a change to Release, merge to main first.

on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]

permissions:
  contents: read

concurrency:
  # workflow_run carries no meaningful github.ref — key on the underlying
  # head_sha so two pipeline runs for the same SHA (branch push + tag push)
  # serialize. Never cancel; the gate dedups any duplicate trigger.
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    # Three-fact gate: Pipeline must have succeeded for a push to main, and the
    # head SHA must carry a tag we haven't already released. Any failing fact →
    # all downstream jobs no-op via `if: needs.gate.outputs.tag != ''`.
    name: Gate
    runs-on: ubuntu-24.04
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref:          ${{ github.event.workflow_run.head_sha }}
          fetch-depth:  0  # need full history + tags for the points-at check

      - id:   gate
        name: Resolve tag at HEAD (and dedup)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tagged commits typically produce TWO Pipeline runs (branch push +
        # tag push), each firing Release. We dedup by skipping if a GitHub
        # release for this tag already exists from the first run.
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | head -n1)
          if [ -z "${tag}" ]; then
            echo "No tag at $(git rev-parse HEAD) — Pipeline succeeded but nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists — duplicate trigger ignored."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing ${tag} at $(git rev-parse HEAD)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  publish-npm:
    # Checks out the validated release tag (a gate job-output ref, not raw
    # event data) to build and publish. Using needs.gate.outputs.tag as the ref
    # breaks the CodeQL taint chain for both untrusted-checkout and
    # cache-poisoning — no artifact bridge needed, no shared state written.
    name: Publish npm + GitHub release
    needs: gate
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # GitHub release creation
      id-token: write  # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v6
        with:
          # Gate-validated tag ref — not raw workflow_run.head_sha.
          # Job output boundary prevents CodeQL from tainting this ref.
          ref:         ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          # No cache: npm — avoids writing packages from this checkout into the
          # shared GHA cache where other workflows could restore them.

      - run: npm ci

      # prepublishOnly runs the build before publish; no explicit build step needed.
      - name: Publish to npm
        run:  npm publish --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:               ${{ needs.gate.outputs.tag }}
          generate_release_notes: true

  update-floating-tags:
    # Moves the floating major/minor tags (1, 1.2) to the new release SHA.
    # Runs after publish-npm succeeds. Uses contents: write only — no OIDC —
    # so the checkout cannot be leveraged to exfiltrate privileged tokens.
    # Floating tags let Marketplace consumers pin `@1` / `@1.2` and keep
    # receiving patch updates. Pushed with GITHUB_TOKEN so the tag push does
    # not retrigger Pipeline → no Release loop.
    name: Update floating tags
    needs: [gate, publish-npm]
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Check out the validated release tag rather than the raw head_sha so
          # the ref is a named, published ref — not raw external event data.
          ref:         ${{ needs.gate.outputs.tag }}
          fetch-depth: 0

      - name: Update floating major/minor tags
        env:
          VERSION: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          if ! [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Skipping floating tags — '${VERSION}' is not a clean semver (pre-release or build metadata)"
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for floating in "${major}" "${minor}"; do
            echo "Moving ${floating} → $(git rev-parse HEAD)"
            git tag --force --annotate "${floating}" --message "Floating tag for ${VERSION}"
            git push --force origin "refs/tags/${floating}"
          done

  build-image:
    # Per-arch image build on a native runner. Exports a single-platform OCI
    # layout tar — no registry credentials required at build time. The separate
    # push-image job handles the privileged push so Dockerfile RUN commands
    # never execute in a context that holds packages: write or id-token: write.
    name: Build image (${{ matrix.arch }})
    needs: gate
    if:    needs.gate.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch:     amd64
            platform: linux/amd64
            runner:   ubuntu-24.04
          - arch:     arm64
            platform: linux/arm64
            runner:   ubuntu-24.04-arm  # native GitHub-hosted arm64, no QEMU
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Image labels
        id:   meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build image (OCI export, no push)
        uses: docker/build-push-action@v7
        with:
          context:    .
          platforms:  ${{ matrix.platform }}
          labels:     ${{ steps.meta.outputs.labels }}
          # Export as OCI layout tar — no registry login needed, no credential
          # access during Dockerfile execution.
          outputs:    type=oci,dest=${{ runner.temp }}/image-${{ matrix.arch }}.tar
          # Per-arch cache scopes so amd64 and arm64 don't evict each other.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to:   type=gha,scope=${{ matrix.arch }},mode=max

      - uses: actions/upload-artifact@v7
        with:
          name:              image-oci-${{ matrix.arch }}
          path:              ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days:    1

  push-image:
    # Loads the pre-built OCI tar and pushes by digest to GHCR. No checkout,
    # no code from the repository runs here — only the trusted registry action.
    name: Push image (${{ matrix.arch }})
    needs: [gate, build-image]
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04  # any runner; imagetools create is registry-side
    permissions:
      contents: read
      id-token: write  # OIDC for GHCR build attestation
      packages: write  # push image by digest to GHCR
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-oci-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id:   push
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository }}"
          oci_dir="${RUNNER_TEMP}/oci-${{ matrix.arch }}"
          # imagetools create requires an OCI layout directory, not a tar file.
          mkdir -p "${oci_dir}"
          tar -xf "${{ runner.temp }}/image-${{ matrix.arch }}.tar" --directory "${oci_dir}"
          # OCI layout has no named tag; reference the single manifest by its content digest
          # so imagetools does not fall back to `:latest` (which does not exist in the layout).
          manifest_digest=$(jq -r '.manifests[0].digest' "${oci_dir}/index.json")
          # Push the pre-built image layers; capture the digest for the manifest job.
          docker buildx imagetools create \
            --tag "${image}:build-${{ matrix.arch }}" \
            "oci-layout://${oci_dir}@${manifest_digest}"
          digest=$(docker buildx imagetools inspect "${image}:build-${{ matrix.arch }}" \
            --format '{{.Manifest.Digest}}')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${{ matrix.arch }}: ${digest}"

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name:              digests-${{ matrix.arch }}
          path:              ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days:    1

  publish-manifest:
    # Glue step: download per-arch digests, create a single multiarch manifest
    # list under the released tags, and push. Sole writer of the release tags.
    name: Publish manifest
    needs: [gate, push-image]
    if:    needs.gate.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      id-token:  write  # OIDC for GHCR attestation on the manifest list
      packages:  write  # push the multiarch manifest list
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path:            ${{ runner.temp }}/digests
          pattern:         digests-*
          merge-multiple:  true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id:   meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is auto-applied on semver values.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.gate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.gate.outputs.tag }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
