name: Documentation
# Builds typedoc and deploys to GitHub Pages using the native Pages deployment
# (no third-party push-to-gh-pages action). Requires repo Pages source to be
# set to "GitHub Actions" in Settings → Pages.
#
# Triggered by Pipeline completion: docs only build when Pipeline went green
# for a push to main. Workflow_dispatch is preserved for manual rebuilds.
#
# Note: workflow_run-triggered workflows always run the version of this file
# from the default branch.

on:
  workflow_run:
    workflows: [Pipeline]
    types:     [completed]
  workflow_dispatch:

permissions:
  contents: read  # build job only needs read; deploy job declares its own elevated permissions

concurrency:
  # Only one Pages deployment at a time; never cancel mid-deploy.
  group:              pages
  cancel-in-progress: false

jobs:
  build:
    name:    Build
    runs-on: ubuntu-24.04
    # Build on green Pipeline for a main push, or on manual dispatch. PR
    # pipeline runs and tag-push pipeline runs are intentionally skipped —
    # docs reflect main only.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v6
        with:
          # github.sha = default-branch HEAD, non-tainted by workflow_run event data.
          # Works for both workflow_run and workflow_dispatch; docs always reflect main.
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache:        pnpm

      - uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild

      - name: Generate typedoc
        run:  pnpm generate-docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/generated

  deploy:
    name:    Deploy
    needs:   build
    runs-on: ubuntu-24.04
    permissions:
      pages:    write
      id-token: write  # OIDC attestation for the Pages artifact
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - id:   deployment
        uses: actions/deploy-pages@v5
