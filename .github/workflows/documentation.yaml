name: Documentation
# Builds typedoc and deploys to GitHub Pages using the native Pages deployment
# (no third-party push-to-gh-pages action). Requires repo Pages source to be
# set to "GitHub Actions" in Settings → Pages.
#
# Runs on main pushes only (the github-pages environment allows main); dispatch rebuilds manually.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read  # build job only needs read; deploy job declares its own elevated permissions

concurrency:
  # Only one Pages deployment at a time; never cancel mid-deploy.
  group:              pages
  cancel-in-progress: false

jobs:
  build:
    name:    Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache:        pnpm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild

      - name: Generate typedoc
        run:  pnpm generate-docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/generated

  deploy:
    name:    Deploy
    needs:   build
    runs-on: ubuntu-26.04
    permissions:
      pages:    write
      id-token: write  # OIDC attestation for the Pages artifact
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - id:   deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
