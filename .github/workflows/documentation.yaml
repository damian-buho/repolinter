name: Documentation
# Builds typedoc and deploys to GitHub Pages using the native Pages deployment
# (no third-party push-to-gh-pages action). Requires repo Pages source to be
# set to "GitHub Actions" in Settings → Pages.
#
# Triggered by Pipeline completion: docs only build when Pipeline went green
# for a push to main. Workflow_dispatch is preserved for manual rebuilds.
#
# Note: workflow_run-triggered workflows always run the version of this file
# from the default branch.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Pipeline]
    types:     [completed]
  workflow_dispatch:

permissions:
  contents: read  # build job only needs read; deploy job declares its own elevated permissions

concurrency:
  # Only one Pages deployment at a time; never cancel mid-deploy.
  group:              pages
  cancel-in-progress: false

jobs:
  build:
    name:    Build
    runs-on: ubuntu-26.04
    # Build on green Pipeline for a main push, or on manual dispatch. PR
    # pipeline runs and tag-push pipeline runs are intentionally skipped —
    # docs reflect main only.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # github.sha = default-branch HEAD, non-tainted by workflow_run event data.
          # Works for both workflow_run and workflow_dispatch; docs always reflect main.
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache:        pnpm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild

      - name: Generate typedoc
        run:  pnpm generate-docs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/generated

  deploy:
    name:    Deploy
    needs:   build
    runs-on: ubuntu-26.04
    permissions:
      pages:    write
      id-token: write  # OIDC attestation for the Pages artifact
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}
    steps:
      - id:   deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
